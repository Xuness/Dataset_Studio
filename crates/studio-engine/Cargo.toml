[package]
name = "studio-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
[dependencies]
studio-domain = { path = "../studio-domain" }
studio-application = { path = "../studio-application" }
studio-storage = { path = "../studio-storage" }
studio-sources = { path = "../studio-sources" }
studio-protocol = { path = "../studio-protocol" }
studio-operators = { path = "../studio-operators" }
studio-resources = { path = "../studio-resources" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
utoipa.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fs2.workspace = true
clap.workspace = true
futures.workspace = true
async-stream.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
tempfile.workspace = true
tokio-util = { version = "0.7", features = ["io", "codec"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem"] }
[dev-dependencies]
rusqlite.workspace = true
