[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-lake-worker"
version = "0.2.0"
description = "Dataset Studio owned lake acquisition, encoding and canonical archive service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pyarrow==24.0.0", "duckdb==1.5.4", "requests==2.33.1",
  "Pillow==12.2.0", "apsw==3.53.4.0", "tzdata>=2025,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
